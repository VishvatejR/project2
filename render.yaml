services:
  - type: web
    name: clearpay-invoice-decision-desk
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PO_TOLERANCE_PCT
        value: 2.0
